<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tondu Padel League 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1923; color: #e8eaf0; min-height: 100vh; }

    .header { background: linear-gradient(135deg, #6b1a1a 0%, #4a0d0d 100%); padding: 28px 20px 20px; text-align: center; border-bottom: 3px solid #e74c3c; }
    .header h1 { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .header p { color: #ffffff; margin-top: 6px; font-size: 14px; }

    .tabs { display: flex; background: #151f2b; border-bottom: 2px solid #1e2d3d; position: sticky; top: 0; z-index: 10; }
    .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 700; color: #ffffff; transition: all 0.2s; font-size: 15px; letter-spacing: 0.3px; }
    .tab.active { color: #e74c3c; border-bottom: 3px solid #e74c3c; background: #1a2535; }
    .tab:hover:not(.active) { color: #ffffff; background: #1e2d3d; }

    .content { display: none; padding: 20px; max-width: 860px; margin: 0 auto; }
    .content.active { display: block; }

    .section-title { font-size: 13px; font-weight: 700; color: #e74c3c; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; display: inline-block; width: 3px; height: 16px; background: #e74c3c; border-radius: 2px; }

    /* League Table */
    .table-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    table { width: 100%; border-collapse: collapse; background: #1a2535; font-size: 13px; min-width: 500px; }
    thead th { background: #3d0d0d; color: #ffffff; padding: 10px 8px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; }
    thead th.col-team { text-align: left; padding-left: 14px; }
    tbody tr { border-bottom: 1px solid #1e2d3d; transition: background 0.15s; }
    tbody tr:hover { background: #1e2d3d; }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 8px; text-align: center; color: #ffffff; font-size: 13px; }
    tbody td.col-pos { color: #aabbcc; font-weight: 700; font-size: 12px; width: 30px; }
    tbody td.col-team { text-align: left; padding-left: 14px; font-weight: 600; color: #ffffff; max-width: 200px; }
    tbody td.col-pts { font-weight: 800; color: #e74c3c; font-size: 15px; }
    tbody tr:first-child { background: rgba(231,76,60,0.07); }
    tbody tr:first-child td.col-team::after { content: ' 🥇'; font-size: 11px; }

    /* Rounds */
    .round-card { background: #1a2535; border-radius: 10px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
    .round-header { background: #3d0d0d; padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .round-header h3 { font-size: 14px; font-weight: 700; color: #fff; }
    .round-header .week-label { font-size: 12px; color: #ffffff; font-weight: 500; }
    .round-toggle { color: #ffffff; font-size: 18px; transition: transform 0.2s; line-height: 1; }
    .round-card.collapsed .round-toggle { transform: rotate(-90deg); }
    .round-body { }
    .round-card.collapsed .round-body { display: none; }

    .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; border-bottom: 1px solid #111d2a; gap: 10px; }
    .match-row:last-child { border-bottom: none; }
    .team-name { font-size: 13px; color: #ffffff; font-weight: 500; line-height: 1.3; }
    .team-name.home { text-align: right; }
    .team-name.away { text-align: left; }
    .match-centre { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .score-input { width: 36px; height: 36px; background: #0f1923; border: 2px solid #1e2d3d; border-radius: 6px; color: #ffffff; font-size: 17px; font-weight: 700; text-align: center; outline: none; transition: border-color 0.15s; -moz-appearance: textfield; }
    .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-input:focus { border-color: #e74c3c; }
    .score-input.has-score { border-color: #5a1a1a; background: #2a0d0d; }
    .vs-sep { color: #aabbcc; font-weight: 700; font-size: 13px; }
    .save-btn { background: #e74c3c; color: #ffffff; border: none; border-radius: 6px; padding: 7px 13px; font-size: 11px; font-weight: 800; cursor: pointer; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.3px; text-transform: uppercase; }
    .save-btn:hover { background: #c0392b; }
    .save-btn.saved { background: #1a2535; color: #aabbcc; border: 1px solid #1e2d3d; cursor: default; }

    .result-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
    .result-H { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .result-A { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .result-D { background: rgba(243,156,18,0.15); color: #f39c12; }

    .footer { text-align: center; color: #aabbcc; font-size: 12px; padding: 30px 20px; }

    @media (max-width: 580px) {
      .team-name { font-size: 11px; }
      .score-input { width: 30px; height: 30px; font-size: 15px; }
      .header h1 { font-size: 22px; }
      .save-btn { padding: 6px 10px; font-size: 10px; }
      .match-row { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🎾 Tondu Padel League 2026</h1>
  <p>Enter scores using sets won &nbsp;·&nbsp; Table updates automatically</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('a')">League A</div>
  <div class="tab" onclick="showTab('b')">League B</div>
</div>

<div id="tab-a" class="content active">
  <div class="section-title">League Table</div>
  <div class="table-wrap"><table id="table-a"></table></div>
  <div class="section-title" style="margin-top:28px">Fixtures &amp; Results</div>
  <div id="fixtures-a"></div>
</div>

<div id="tab-b" class="content">
  <div class="section-title">League Table</div>
  <div class="table-wrap"><table id="table-b"></table></div>
  <div class="section-title" style="margin-top:28px">Fixtures &amp; Results</div>
  <div id="fixtures-b"></div>
</div>

<div class="footer">Tondu Padel League 2026 &nbsp;·&nbsp; Scores saved in your browser</div>

<script>
const LEAGUES = {
  a: {
    name: "League A",
    teams: [
      "C. Woolls & O. Pengilly",
      "A. Warner & M. Hughes",
      "D. Fitzgerald & M. Hayes",
      "S. Brown & M. Jones",
      "D. Parry & T. Woolls",
      "J. Tiley & M. Penny",
      "L. Brown & J. Hurst",
      "G. Lindenburn & J. Gatt"
    ],
    fixtures: [
      [ // Round 1
        ["C. Woolls & O. Pengilly", "G. Lindenburn & J. Gatt"],
        ["A. Warner & M. Hughes", "L. Brown & J. Hurst"],
        ["D. Fitzgerald & M. Hayes", "J. Tiley & M. Penny"],
        ["S. Brown & M. Jones", "D. Parry & T. Woolls"]
      ],
      [ // Round 2
        ["C. Woolls & O. Pengilly", "L. Brown & J. Hurst"],
        ["G. Lindenburn & J. Gatt", "J. Tiley & M. Penny"],
        ["A. Warner & M. Hughes", "D. Parry & T. Woolls"],
        ["D. Fitzgerald & M. Hayes", "S. Brown & M. Jones"]
      ],
      [ // Round 3
        ["C. Woolls & O. Pengilly", "J. Tiley & M. Penny"],
        ["L. Brown & J. Hurst", "D. Parry & T. Woolls"],
        ["G. Lindenburn & J. Gatt", "S. Brown & M. Jones"],
        ["A. Warner & M. Hughes", "D. Fitzgerald & M. Hayes"]
      ],
      [ // Round 4
        ["C. Woolls & O. Pengilly", "D. Parry & T. Woolls"],
        ["J. Tiley & M. Penny", "S. Brown & M. Jones"],
        ["L. Brown & J. Hurst", "D. Fitzgerald & M. Hayes"],
        ["G. Lindenburn & J. Gatt", "A. Warner & M. Hughes"]
      ],
      [ // Round 5
        ["C. Woolls & O. Pengilly", "S. Brown & M. Jones"],
        ["D. Parry & T. Woolls", "D. Fitzgerald & M. Hayes"],
        ["J. Tiley & M. Penny", "A. Warner & M. Hughes"],
        ["L. Brown & J. Hurst", "G. Lindenburn & J. Gatt"]
      ],
      [ // Round 6
        ["C. Woolls & O. Pengilly", "D. Fitzgerald & M. Hayes"],
        ["S. Brown & M. Jones", "A. Warner & M. Hughes"],
        ["D. Parry & T. Woolls", "G. Lindenburn & J. Gatt"],
        ["J. Tiley & M. Penny", "L. Brown & J. Hurst"]
      ],
      [ // Round 7
        ["C. Woolls & O. Pengilly", "A. Warner & M. Hughes"],
        ["D. Fitzgerald & M. Hayes", "G. Lindenburn & J. Gatt"],
        ["S. Brown & M. Jones", "L. Brown & J. Hurst"],
        ["D. Parry & T. Woolls", "J. Tiley & M. Penny"]
      ]
    ]
  },
  b: {
    name: "League B",
    teams: [
      "M. Hurst & J. Murphy",
      "D. Bishop & H. Morgan",
      "B. Farnham & S. Brown",
      "T. Warwick & N. Rees",
      "L. Davies & G. Abbers",
      "T. Saunders & O. Barrass",
      "L. Woolls & S. Grabham",
      "M. Tatchell & H. Davies"
    ],
    fixtures: [
      [ // Round 1
        ["M. Hurst & J. Murphy", "M. Tatchell & H. Davies"],
        ["D. Bishop & H. Morgan", "L. Woolls & S. Grabham"],
        ["B. Farnham & S. Brown", "T. Saunders & O. Barrass"],
        ["T. Warwick & N. Rees", "L. Davies & G. Abbers"]
      ],
      [ // Round 2
        ["M. Hurst & J. Murphy", "L. Woolls & S. Grabham"],
        ["M. Tatchell & H. Davies", "T. Saunders & O. Barrass"],
        ["D. Bishop & H. Morgan", "L. Davies & G. Abbers"],
        ["B. Farnham & S. Brown", "T. Warwick & N. Rees"]
      ],
      [ // Round 3
        ["M. Hurst & J. Murphy", "T. Saunders & O. Barrass"],
        ["L. Woolls & S. Grabham", "L. Davies & G. Abbers"],
        ["M. Tatchell & H. Davies", "T. Warwick & N. Rees"],
        ["D. Bishop & H. Morgan", "B. Farnham & S. Brown"]
      ],
      [ // Round 4
        ["M. Hurst & J. Murphy", "L. Davies & G. Abbers"],
        ["T. Saunders & O. Barrass", "T. Warwick & N. Rees"],
        ["L. Woolls & S. Grabham", "B. Farnham & S. Brown"],
        ["M. Tatchell & H. Davies", "D. Bishop & H. Morgan"]
      ],
      [ // Round 5
        ["M. Hurst & J. Murphy", "T. Warwick & N. Rees"],
        ["L. Davies & G. Abbers", "B. Farnham & S. Brown"],
        ["T. Saunders & O. Barrass", "D. Bishop & H. Morgan"],
        ["L. Woolls & S. Grabham", "M. Tatchell & H. Davies"]
      ],
      [ // Round 6
        ["M. Hurst & J. Murphy", "B. Farnham & S. Brown"],
        ["T. Warwick & N. Rees", "D. Bishop & H. Morgan"],
        ["L. Davies & G. Abbers", "M. Tatchell & H. Davies"],
        ["T. Saunders & O. Barrass", "L. Woolls & S. Grabham"]
      ],
      [ // Round 7
        ["M. Hurst & J. Murphy", "D. Bishop & H. Morgan"],
        ["B. Farnham & S. Brown", "M. Tatchell & H. Davies"],
        ["T. Warwick & N. Rees", "L. Woolls & S. Grabham"],
        ["L. Davies & G. Abbers", "T. Saunders & O. Barrass"]
      ]
    ]
  }
};

const WEEKS = [
  "w/c 9 Jun 2026",
  "w/c 16 Jun 2026",
  "w/c 23 Jun 2026",
  "w/c 30 Jun 2026",
  "w/c 7 Jul 2026",
  "w/c 14 Jul 2026",
  "w/c 21 Jul 2026"
];

function scoreKey(league, round, match) {
  return `tondu2026_${league}_r${round}_m${match}`;
}

function getScore(league, round, match) {
  const val = localStorage.getItem(scoreKey(league, round, match));
  return val ? JSON.parse(val) : null;
}

function saveScore(league, round, match, home, away) {
  if (home === '' && away === '') {
    localStorage.removeItem(scoreKey(league, round, match));
  } else {
    localStorage.setItem(scoreKey(league, round, match), JSON.stringify({home: parseInt(home), away: parseInt(away)}));
  }
}

function calcTable(leagueKey) {
  const league = LEAGUES[leagueKey];
  const stats = {};
  league.teams.forEach(t => {
    stats[t] = { team: t, P: 0, W: 0, D: 0, L: 0, SF: 0, SA: 0, Pts: 0 };
  });

  league.fixtures.forEach((round, ri) => {
    round.forEach((match, mi) => {
      const score = getScore(leagueKey, ri, mi);
      if (score !== null && score.home !== undefined && score.away !== undefined) {
        const [home, away] = match;
        const hs = score.home, as_ = score.away;
        stats[home].P++; stats[away].P++;
        stats[home].SF += hs; stats[home].SA += as_;
        stats[away].SF += as_; stats[away].SA += hs;
        if (hs > as_) {
          stats[home].W++; stats[home].Pts += 3;
          stats[away].L++;
        } else if (as_ > hs) {
          stats[away].W++; stats[away].Pts += 3;
          stats[home].L++;
        } else {
          stats[home].D++; stats[home].Pts += 1;
          stats[away].D++; stats[away].Pts += 1;
        }
      }
    });
  });

  return Object.values(stats).sort((a, b) => {
    if (b.Pts !== a.Pts) return b.Pts - a.Pts;
    const aSD = a.SF - a.SA, bSD = b.SF - b.SA;
    if (bSD !== aSD) return bSD - aSD;
    if (b.SF !== a.SF) return b.SF - a.SF;
    return a.team.localeCompare(b.team);
  });
}

function renderTable(leagueKey) {
  const rows = calcTable(leagueKey);
  const el = document.getElementById(`table-${leagueKey}`);
  el.innerHTML = `
    <thead>
      <tr>
        <th class="col-pos">#</th>
        <th class="col-team">Team</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>SF</th>
        <th>SA</th>
        <th>SD</th>
        <th class="col-pts">Pts</th>
      </tr>
    </thead>
    <tbody>
      ${rows.map((r, i) => `
        <tr>
          <td class="col-pos">${i + 1}</td>
          <td class="col-team">${r.team}</td>
          <td>${r.P}</td>
          <td>${r.W}</td>
          <td>${r.D}</td>
          <td>${r.L}</td>
          <td>${r.SF}</td>
          <td>${r.SA}</td>
          <td>${r.SF - r.SA}</td>
          <td class="col-pts">${r.Pts}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
}

function renderFixtures(leagueKey) {
  const league = LEAGUES[leagueKey];
  const container = document.getElementById(`fixtures-${leagueKey}`);
  container.innerHTML = '';

  league.fixtures.forEach((round, ri) => {
    const card = document.createElement('div');
    card.className = 'round-card';
    card.id = `round-${leagueKey}-${ri}`;

    const matchRows = round.map((match, mi) => {
      const score = getScore(leagueKey, ri, mi);
      const hVal = score !== null ? score.home : '';
      const aVal = score !== null ? score.away : '';
      const hasScore = score !== null;

      let resultBadge = '';
      if (hasScore) {
        if (hVal > aVal) resultBadge = `<span class="result-badge result-H">Home wins</span>`;
        else if (aVal > hVal) resultBadge = `<span class="result-badge result-A">Away wins</span>`;
        else resultBadge = `<span class="result-badge result-D">Draw</span>`;
      }

      return `
        <div class="match-row">
          <div class="team-name home">${match[0]}</div>
          <div class="match-centre">
            <input class="score-input ${hasScore ? 'has-score' : ''}" type="number" min="0" max="9"
              id="h-${leagueKey}-${ri}-${mi}" value="${hVal}" placeholder="–"
              oninput="markUnsaved('${leagueKey}',${ri},${mi})">
            <span class="vs-sep">–</span>
            <input class="score-input ${hasScore ? 'has-score' : ''}" type="number" min="0" max="9"
              id="a-${leagueKey}-${ri}-${mi}" value="${aVal}" placeholder="–"
              oninput="markUnsaved('${leagueKey}',${ri},${mi})">
            <button class="save-btn ${hasScore ? 'saved' : ''}"
              id="btn-${leagueKey}-${ri}-${mi}"
              onclick="saveAndRefresh('${leagueKey}',${ri},${mi})">
              ${hasScore ? 'Saved' : 'Save'}
            </button>
          </div>
          <div class="team-name away">${match[1]}&nbsp;&nbsp;${resultBadge}</div>
        </div>
      `;
    }).join('');

    card.innerHTML = `
      <div class="round-header" onclick="toggleRound('${leagueKey}',${ri})">
        <h3>Round ${ri + 1}</h3>
        <span class="week-label">${WEEKS[ri]}</span>
        <span class="round-toggle">▾</span>
      </div>
      <div class="round-body">${matchRows}</div>
    `;

    container.appendChild(card);
  });
}

function markUnsaved(league, round, match) {
  const btn = document.getElementById(`btn-${league}-${round}-${match}`);
  if (btn) {
    btn.textContent = 'Save';
    btn.classList.remove('saved');
  }
}

function saveAndRefresh(league, round, match) {
  const hEl = document.getElementById(`h-${league}-${round}-${match}`);
  const aEl = document.getElementById(`a-${league}-${round}-${match}`);
  const h = hEl.value.trim();
  const a = aEl.value.trim();

  if (h === '' || a === '') {
    alert('Please enter both scores before saving.');
    return;
  }

  saveScore(league, round, match, h, a);

  // Update button and inputs
  const btn = document.getElementById(`btn-${league}-${round}-${match}`);
  btn.textContent = 'Saved';
  btn.classList.add('saved');
  hEl.classList.add('has-score');
  aEl.classList.add('has-score');

  // Refresh table
  renderTable(league);
}

function toggleRound(league, ri) {
  const card = document.getElementById(`round-${league}-${ri}`);
  card.classList.toggle('collapsed');
}

function showTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${key}')"]`).classList.add('active');
  document.getElementById(`tab-${key}`).classList.add('active');
}

// Init
['a', 'b'].forEach(key => {
  renderFixtures(key);
  renderTable(key);
});
</script>

</html>
